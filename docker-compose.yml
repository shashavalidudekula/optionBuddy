services:
  postgres:
    image: postgres:16-alpine
    container_name: optionbuddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_agent
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    command: ["postgres", "-c", "timezone=Asia/Kolkata"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  advisory-agent:
    build: .
    container_name: optionbuddy-advisory
    restart: unless-stopped
    command: ["python", "main_advisory.py"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: trading_agent
      DB_USER: trading_user
      DB_PASSWORD: trading_password
      PYTHONUNBUFFERED: 1
      TZ: Asia/Kolkata
    volumes:
      - ./logs:/app/logs
    networks:
      - trading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build: .
    container_name: optionbuddy-dashboard
    restart: unless-stopped
    command: ["uvicorn", "web.dashboard:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: trading_agent
      DB_USER: trading_user
      DB_PASSWORD: trading_password
      PYTHONUNBUFFERED: 1
      TZ: Asia/Kolkata
    volumes:
      # Read the durable paper-history ledger the engine writes, so the
      # Daily/Weekly P&L tables can see every closed trade (incl. manual /exit).
      - ./logs:/app/logs:ro
    ports:
      - "8000:8000"
    networks:
      - trading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

networks:
  trading-network:
    driver: bridge
