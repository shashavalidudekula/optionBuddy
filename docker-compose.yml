services:
  postgres:
    image: postgres:16-alpine
    container_name: optionbuddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_agent
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    command: ["postgres", "-c", "timezone=Asia/Kolkata"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  advisory-agent:
    build: .
    container_name: optionbuddy-advisory
    restart: unless-stopped
    command: ["python", "main_advisory.py"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: trading_agent
      DB_USER: trading_user
      DB_PASSWORD: trading_password
      PYTHONUNBUFFERED: 1
      TZ: Asia/Kolkata
    volumes:
      - ./logs:/app/logs
    networks:
      - trading-network
    healthcheck:
      # Loop writes logs/heartbeat every iteration; stale ⇒ hung/dead ⇒ unhealthy.
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard-opt-buy:
    build: .
    container_name: optionbuddy-dashboard-opt-buy
    restart: unless-stopped
    command: ["uvicorn", "web.dashboard:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: trading_agent
      DB_USER: trading_user
      DB_PASSWORD: trading_password
      DASHBOARD_STRATEGY: opt_buy
      PYTHONUNBUFFERED: 1
      TZ: Asia/Kolkata
    volumes:
      - ./logs:/app/logs
    ports:
      - "8001:8001"
    networks:
      - trading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard-opt-sell-spread:
    build: .
    container_name: optionbuddy-dashboard-opt-sell-spread
    restart: unless-stopped
    command: ["uvicorn", "web.dashboard:app", "--host", "0.0.0.0", "--port", "8002"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: trading_agent
      DB_USER: trading_user
      DB_PASSWORD: trading_password
      DASHBOARD_STRATEGY: opt_sell_spread
      PYTHONUNBUFFERED: 1
      TZ: Asia/Kolkata
    volumes:
      - ./logs:/app/logs
    ports:
      - "8002:8002"
    networks:
      - trading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard-stock-opt:
